<!DOCTYPE html>
<html lang="en">

    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&family=Oswald:wght@400;500;700&display=swap" rel="stylesheet">

    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: { sans: ['Inter', 'sans-serif'], display: ['Oswald', 'sans-serif'] },
                    colors: { gta: { black: '#000', panel: '#121212', yellow: '#fbbf24', green: '#2ecc71', blue: '#3498db', red: '#e74c3c' } }
                }
            }
        }
    </script>

    <style>
        body {
            background-color: #000; color: #e5e5e5;
            background-image: linear-gradient(to bottom, rgba(0,0,0,0.85), #000), url('https://placehold.co/1920x1080/111/222?text=GTA+V');
            background-size: cover; background-attachment: fixed; background-position: center;
            font-family: 'Inter', sans-serif;
        }
        
        .r-header { font-family: 'Oswald', sans-serif; text-transform: uppercase; letter-spacing: 1px; }
        .r-panel { 
            background-color: rgba(24, 24, 24, 0.98); 
            border-top: 2px solid #333; border-bottom: 2px solid #333;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }

        /* Custom Scrollbars */
        .custom-scroll::-webkit-scrollbar { width: 6px; height: 6px; }
        .custom-scroll::-webkit-scrollbar-track { background: #111; }
        .custom-scroll::-webkit-scrollbar-thumb { background: #fbbf24; border-radius: 4px; }
        .custom-scroll::-webkit-scrollbar-thumb:hover { background: #d97706; }
        
        /* Rockstar Logo Style */
        .r-logo-container {
            background-color: #fbbf24;
            border-radius: 10px;
            width: 64px; height: 64px;
            position: relative;
            overflow: hidden;
            box-shadow: 0 2px 5px rgba(0,0,0,0.5);
        }
        .r-logo-r {
            font-family: 'TeX Gyre Heros', Helvetica, Arial, sans-serif;
            font-weight: 700; 
            font-size: 42px; 
            line-height: 1;
            color: #000; /* Siyah */
            font-style: italic;
            position: absolute; 
            top: 10px; 
            left: 6px; 
            /* Siyah Kontur */
            -webkit-text-stroke: 1px black;
            transform: scaleY(0.9); 
            z-index: 1;
        }
        .r-logo-star {
            position: absolute; 
            bottom: 6px; 
            right: 4px; 
            font-size: 16px; 
            font-weight: 900; 
            font-style: italic;
            color: #fff; /* Beyaz */
            /* Siyah Kontur */
            -webkit-text-stroke: 2px black;
            paint-order: stroke fill;
            z-index: 2;
        }

        /* Buttons */
        .btn-main {
            font-family: 'Oswald', sans-serif; text-transform: uppercase;
            background: transparent; color: #888; border: 1px solid #333;
            padding: 8px 24px; font-size: 1.1rem; cursor: pointer; transition: all 0.2s;
        }
        .btn-main:hover { color: #fff; border-color: #666; }
        .btn-main.active { background-color: #fbbf24; color: #000; border-color: #fbbf24; font-weight: 700; }

        /* Filters */
        .btn-filter {
            font-family: 'Oswald', sans-serif; text-transform: uppercase;
            color: #9ca3af; padding: 6px 16px; margin-right: 4px;
            border-bottom: 3px solid transparent; transition: all 0.2s;
            white-space: nowrap; font-size: 1rem; cursor: pointer;
        }
        .btn-filter:hover { color: #fff; background-color: #1a1a1a; }
        .btn-filter.active { color: #fbbf24; border-bottom-color: #fbbf24; }
        .filter-sep { color: #444; margin: 0 8px; font-weight: 300; user-select: none; }

        /* Cards */
        .v-card {
            background-color: #121212; border: 1px solid #2a2a2a;
            transition: transform 0.2s, border-color 0.2s; position: relative;
            display: flex; flex-direction: column;
        }
        .v-card:hover { border-color: #fbbf24; transform: translateY(-3px); box-shadow: 0 10px 20px rgba(0,0,0,0.5); }
        .v-img-box { position: relative; width: 100%; padding-top: 56.25%; background: #000; border-bottom: 2px solid #222; }
        .v-img { position: absolute; top: 0; left: 0; width: 100%; height: 100%; object-fit: cover; }
        
        .v-tag { display: none; } 

        .stat-bar-track { background: #333; height: 8px; width: 100%; margin-top: 4px; border-radius: 1px; overflow: hidden; }
        .stat-bar-fill { height: 100%; transition: width 0.8s ease-out; }
        
        .no-scroll::-webkit-scrollbar { display: none; }
        
        @keyframes fadeInUp { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }
        .animate-in { animation: fadeInUp 0.4s ease-out forwards; }
        
        #app-loader { position: fixed; top:0; left:0; right:0; bottom:0; background: #000; z-index: 9999; display: flex; align-items: center; justify-content: center; flex-direction: column; }
        #debug-console { display:none; position: fixed; bottom: 0; left: 0; right: 0; background: #7f1d1d; color: white; font-family: monospace; font-size: 12px; padding: 10px; z-index: 10000; max-height: 150px; overflow-y: auto; border-top: 2px solid red; }
    </style>
</head>

            ['garage', 'type', 'brand', 'website'].forEach(function(t) {
                var btn = document.getElementById('btn-' + t);
                if(btn) btn.className = 'btn-main ' + (window.appState.sort === t ? 'active' : '');
            });

            var title = document.getElementById('gallery-title');
            if (window.appState.sort === 'garage') title.innerText = 'GARAGES';
            else if (window.appState.sort === 'type') title.innerText = 'VEHICLE CLASSES';
            else if (window.appState.sort === 'brand') title.innerText = 'MANUFACTURERS';
            else title.innerText = 'DEALERSHIPS';

            renderSubFilters();
            renderGrid();
        }

        function renderSubFilters() {
            var container = document.getElementById('sub-filter-container');
            container.innerHTML = '';

            var items = [];
            if (window.appState.sort === 'garage') {
                items = window.gtaData.garages.filter(function(g) { return !g.parent; });
            } else if (window.appState.sort === 'type') {
                items = window.gtaData.types;
            } else if (window.appState.sort === 'website') {
                items = window.gtaData.websites;
            } else if (window.appState.sort === 'brand') {
                var uniqueMakes = [...new Set(window.gtaData.vehicles.map(v => v.make))].sort();
                items = uniqueMakes.map(m => ({ id: m, name: m }));
            }

            var allBtn = document.createElement('button');
            allBtn.className = 'btn-filter ' + (window.appState.filter === 'all' ? 'active' : '');
            allBtn.innerText = 'ALL';
            allBtn.onclick = function() { window.appClickFilter('all'); };
            container.appendChild(allBtn);

            var sep = document.createElement('span');
            sep.className = 'filter-sep'; sep.innerText = '|';
            container.appendChild(sep);

            items.forEach(function(item, idx) {
                var btn = document.createElement('button');
                btn.className = 'btn-filter ' + (window.appState.filter === item.id ? 'active' : '');
                btn.innerText = item.shortName || item.name;
                btn.onclick = (function(id) { 
                    return function() { window.appClickFilter(id); } 
                })(item.id);
                container.appendChild(btn);

                if (idx < items.length - 1) {
                    var s = document.createElement('span');
                    s.className = 'filter-sep'; s.innerText = '|';
                    container.appendChild(s);
                }
            });
        }

        function renderGrid() {
            var grid = document.getElementById('vehicle-grid');
            var empty = document.getElementById('empty-msg');
            var pHeader = document.getElementById('garage-header');
            var fCount = document.getElementById('display-count');
            var fVal = document.getElementById('display-value');

            grid.innerHTML = '';
            pHeader.classList.add('hidden');

            var filtered = window.gtaData.vehicles;
            var propCost = 0;

            if (window.appState.sort === 'garage' && window.appState.filter !== 'all') {
                var g = window.gtaData.garages.find(function(x) { return x.id === window.appState.filter; });
                if (g) {
                    propCost = g.val || (g.basePrice + g.upgradePrice);
                    if (propCost > 0) {
                        document.getElementById('garage-header-name').innerText = g.name.toUpperCase();
                        document.getElementById('garage-header-price').innerText = formatMoney(propCost);
                        pHeader.classList.remove('hidden');
                    }
                }
            }

            if (window.appState.filter !== 'all') {
                var fid = window.appState.filter;
                if (window.appState.sort === 'garage') {
                    filtered = filtered.filter(function(v) {
                        if (v.garageId === fid) return true;
                        var g = window.gtaData.garages.find(function(x) { return x.id === v.garageId; });
                        return g && g.parent === fid;
                    });
                } else if (window.appState.sort === 'type') {
                    filtered = filtered.filter(function(v) { return v.type === fid; });
                } else if (window.appState.sort === 'brand') {
                    filtered = filtered.filter(function(v) { return v.make === fid; });
                } else {
                    filtered = filtered.filter(function(v) { return v.websiteId === fid; });
                }
            }

            filtered.sort(function(a,b) { return b.val - a.val; });

            fCount.innerText = filtered.length;
            var totalVal = filtered.reduce(function(acc, v) { return acc + v.val; }, 0) + propCost;
            fVal.innerText = formatMoney(totalVal);

            if (filtered.length === 0) {
                empty.classList.remove('hidden');
            } else {
                empty.classList.add('hidden');
                filtered.forEach(function(v, i) {
                    var tObj = window.gtaData.types.find(function(t) { return t.id === v.type; });
                    var tName = tObj ? tObj.name : v.type;
                    var img = v.img || 'https://placehold.co/600x400/111/333?text=GTA';

                    var gName = "";
                    var gObj = window.gtaData.garages.find(function(g) { return g.id === v.garageId; });
                    if(gObj) gName = gObj.shortName || gObj.name;

                    var card = document.createElement('div');
                    card.className = 'v-card animate-in flex flex-col h-full';
                    card.style.animationDelay = (i * 0.01) + 's';
                    card.innerHTML = `
                        <div class="v-img-box">
                            <img src="${img}" class="v-img" onerror="this.onerror=null; this.src='https://placehold.co/600x400/111/333?text=No+Image';">
                        </div>
                        <div class="p-4 flex flex-col flex-grow justify-between">
                            <div class="mb-2">
                                <h3 class="text-white font-display text-xl leading-none truncate" title="${v.name}">${v.name}</h3>
                                <div class="flex justify-between items-center mt-1">
                                    <span class="text-xs font-bold text-gray-500 uppercase tracking-wider">${tName}</span>
                                    <span class="text-xs text-gta-yellow truncate ml-2 font-bold uppercase tracking-wide" title="${v.make}">${v.make}</span>
                                </div>
                                <div class="text-xs text-gray-400 mt-1 truncate" title="${gName}">
                                    <i data-lucide="map-pin" class="inline w-3 h-3 mr-1"></i>${gName}
                                </div>
                            </div>
                            <div class="flex justify-between items-end border-t border-zinc-800 pt-2 mt-1">
                                <span class="text-gray-500 text-xs font-bold uppercase">Total Value</span>
                                <span class="text-gta-green font-mono font-bold text-lg">${formatMoney(v.val)}</span>
                            </div>
                        </div>
                    `;
                    grid.appendChild(card);
                });
                if(window.lucide) lucide.createIcons();
            }
        }

        function renderStats() {
            var c1 = document.getElementById('stats-col-1');
            var c2 = document.getElementById('stats-col-2');
            var pList = document.getElementById('property-list-content');

            c1.innerHTML = ''; c2.innerHTML = ''; pList.innerHTML = '';

            var props = window.gtaData.garages.filter(function(g) { return (g.val > 0 || g.basePrice > 0) && !g.parent; });
            var pTotal = 0;
            props.forEach(function(p) { pTotal += (p.val || (p.basePrice + p.upgradePrice)); });
            props.sort(function(a,b) { return vb = b.val || 0, va = a.val || 0, vb - va; });

            props.forEach(function(p, i) {
                var val = p.val || (p.basePrice + p.upgradePrice);
                var row = document.createElement('div');
                row.className = 'flex justify-between border-b border-zinc-800 py-2 px-3 text-sm hover:bg-zinc-800 transition cursor-pointer';
                row.innerHTML = `
                    <div class="flex items-center gap-2 overflow-hidden">
                        <span class="text-gray-500 font-bold min-w-[20px]">${i+1}.</span>
                        <span class="text-zinc-300 truncate" title="${p.name}">${p.name}</span>
                    </div>
                    <span class="text-white font-mono font-bold ml-2 whitespace-nowrap">${formatMoney(val)}</span>
                `;
                row.onclick = function() { window.goToGarage(p.id); };
                pList.appendChild(row);
            });

            document.getElementById('props-count').innerText = props.length + " Owned";
            document.getElementById('props-total-val').innerText = formatMoney(pTotal);

            var vTotal = 0;
            var catMap = {};
            window.gtaData.types.forEach(function(t) {
                catMap[t.id] = { id: t.id, name: t.name, val: 0, count: 0, color: t.color };
            });
            catMap['other'] = { id: 'other', name: 'Other', val: 0, count: 0, color: '#ccc' };

            window.gtaData.vehicles.forEach(function(v) {
                vTotal += v.val;
                var k = v.type;
                if(!catMap[k]) k = 'other';
                catMap[k].val += v.val;
                catMap[k].count++;
            });

            var activeCats = Object.values(catMap).filter(function(c) { return c.count > 0; });
            var maxVal = Math.max(...activeCats.map(c => c.val));
            var half = Math.ceil(activeCats.length / 2);

            activeCats.forEach(function(cat, i) {
                var pct = maxVal > 0 ? (cat.val / maxVal) * 100 : 0;
                var html = `
                    <div class="mb-4 cursor-pointer hover:opacity-80 transition" onclick="window.goToType('${cat.id}')">
                        <div class="flex justify-between items-end mb-1">
                            <span class="text-xs font-bold text-gray-400 uppercase tracking-wider">${cat.name}</span>
                            <span class="text-xs font-bold text-white">${cat.count}</span>
                        </div>
                        <div class="stat-bar-track">
                            <div class="stat-bar-fill" style="width: ${pct}%; background-color: ${cat.color}"></div>
                        </div>
                        <div class="text-right mt-1 text-xs font-bold font-mono text-gta-green tracking-tight">${formatMoney(cat.val)}</div>
                    </div>
                `;
                if(i < half) c1.innerHTML += html;
                else c2.innerHTML += html;
            });

            document.getElementById('veh-count').innerText = window.gtaData.vehicles.length + " Owned";
            document.getElementById('veh-total-val').innerText = formatMoney(vTotal);
            
            var grand = pTotal + vTotal;
            document.getElementById('grand-total').innerText = formatMoney(grand);
            document.getElementById('header-cash').innerText = formatMoney(grand);
        }

        window.onload = function() {
            setTimeout(function() {
                var loader = document.getElementById('app-loader');
                if(loader) loader.style.display = 'none';
            }, 1000);

            if(window.lucide) lucide.createIcons();
            window.appState = { sort: 'garage', filter: 'all' };
            renderStats();
            window.appClickSort('garage');
        };

    </script>
</body>
</html>
