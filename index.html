<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GTA V Asset Manager | URJIKO</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;900&family=Oswald:ital,wght@1,500;1,700&display=swap" rel="stylesheet">
    
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>

    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: { sans: ['Inter', 'sans-serif'], display: ['Oswald', 'sans-serif'] },
                    colors: { 
                        gta: { black: '#000', panel: '#121212', yellow: '#fbbf24', green: '#2ecc71', blue: '#3498db', red: '#e74c3c', zinc: '#18181b' },
                        tier: { S: '#00e5ff', A: '#f1c40f', B: '#a855f7', C: '#22c55e', D: '#94a3b8' }
                    }
                }
            }
        }
    </script>

    <style>
        body {
            background-color: #000; color: #e5e5e5;
            background-image: linear-gradient(to bottom, rgba(0,0,0,0.9), #000), url('https://gtalogo.com/img/8415.png');
            background-size: 400px; background-attachment: fixed; background-position: center;
            font-family: 'Inter', sans-serif;
        }
        
        .r-header { font-family: 'Oswald', sans-serif; text-transform: uppercase; letter-spacing: 1px; }
        .r-panel { 
            background-color: rgba(18, 18, 18, 0.95); 
            border-top: 1px solid #333; border-bottom: 1px solid #333;
            box-shadow: 0 10px 30px rgba(0,0,0,0.7);
        }

        .custom-scroll::-webkit-scrollbar { width: 6px; height: 6px; }
        .custom-scroll::-webkit-scrollbar-track { background: #0a0a0a; }
        .custom-scroll::-webkit-scrollbar-thumb { background: #fbbf24; border-radius: 4px; }
        
        .r-logo-container {
            background-color: #fbbf24; border-radius: 10px; width: 64px; height: 64px;
            position: relative; overflow: hidden; box-shadow: 0 2px 5px rgba(0,0,0,0.5); flex-shrink: 0;
        }
        .r-logo-r {
            font-family: 'Inter', sans-serif; font-weight: 900; font-style: italic;
            font-size: 38px; line-height: 1; color: #000; position: absolute; top: 10px; left: 15px; z-index: 1;
        }
        .r-logo-star {
            position: absolute; bottom: 4px; left: 30px; font-size: 18px; font-weight: 900; font-style: italic;
            color: #fff; -webkit-text-stroke: 1.5px black; paint-order: stroke fill; z-index: 2;
        }

        /* Interactive Flip - Tiered Only */
        .v-card-container { perspective: 1000px; height: 100%; min-height: 340px; }
        .v-card-inner {
            position: relative; width: 100%; height: 100%; text-align: left;
            transition: transform 0.6s cubic-bezier(0.4, 0, 0.2, 1); transform-style: preserve-3d;
        }
        .v-card-container.can-flip:hover .v-card-inner { transform: rotateY(180deg); }
        
        .v-card-front, .v-card-back {
            position: absolute; width: 100%; height: 100%; -webkit-backface-visibility: hidden; backface-visibility: hidden;
            border-radius: 4px; overflow: hidden;
        }
        .v-card-back {
            background-color: #0f0f0f; transform: rotateY(180deg);
            border: 2px solid #fbbf24; display: flex; flex-direction: column; justify-content: center; padding: 20px;
        }

        .v-card { background-color: #121212; border: 1px solid #27272a; height: 100%; transition: all 0.2s ease; }

        .tier-S { border: 2px solid #00e5ff; box-shadow: 0 0 20px rgba(0, 229, 255, 0.2); }
        .tier-S::after {
            content: ''; position: absolute; inset: 0; 
            background: linear-gradient(45deg, transparent 45%, rgba(255,255,255,0.08) 50%, transparent 55%);
            background-size: 200% 200%; animation: shine 4s infinite; pointer-events: none;
        }
        @keyframes shine { 0% { background-position: -200% -200%; } 100% { background-position: 200% 200%; } }

        .btn-main {
            font-family: 'Oswald', sans-serif; text-transform: uppercase;
            background: transparent; color: #71717a; border: 1px solid #27272a;
            padding: 8px 20px; font-size: 1rem; cursor: pointer; transition: all 0.2s;
        }
        .btn-main:hover { color: #fff; border-color: #52525b; background: #09090b; }
        .btn-main.active { background-color: #fbbf24; color: #000; border-color: #fbbf24; font-weight: 700; }

        .btn-filter {
            font-family: 'Oswald', sans-serif; text-transform: uppercase;
            color: #a1a1aa; padding: 6px 14px; border-bottom: 3px solid transparent; 
            transition: all 0.2s; white-space: nowrap; font-size: 0.95rem; cursor: pointer;
        }
        .btn-filter.active { color: #fbbf24; border-bottom-color: #fbbf24; }

        .stat-bar-track { background: #27272a; height: 6px; width: 100%; margin-top: 4px; border-radius: 99px; overflow: hidden; }
        .stat-bar-fill { height: 100%; transition: width 1s cubic-bezier(0.4, 0, 0.2, 1); }

        .animate-in { animation: fadeInUp 0.4s ease-out forwards; opacity: 0; }
        @keyframes fadeInUp { from { opacity: 0; transform: translateY(15px); } to { opacity: 1; transform: translateY(0); } }

        .v-img-box { position: relative; width: 100%; aspect-ratio: 16/9; background: #000; overflow: hidden; }
        .v-img { width: 100%; height: 100%; object-fit: cover; transition: transform 0.5s; }
        
        #search-input::placeholder { color: #52525b; }
    </style>
</head>

        // --- FUZZY IMAGE MATCHING ---
        function getVehicleFilenameVariants(name) {
            // Normalize Turkish chars and remove special chars
            const base = name
                .replace(/İ/g, 'i').replace(/I/g, 'i').replace(/ı/g, 'i')
                .replace(/[^a-zA-Z0-9]/g, "");
            
            return [
                base.toLowerCase() + ".jpg",      // shlagengt.jpg
                base.charAt(0).toUpperCase() + base.slice(1) + ".jpg", // Shlagengt.jpg
                base + ".jpg"                     // SchlagenGT.jpg (if it was exact)
            ];
        }

        function formatVehicleDisplayName(name) {
            if (name.includes("ElegyRetroCustomBrianOconner")) {
                return "Elegy Retro Custom <i class='italic text-gta-yellow'>Brian O'Conner</i>";
            }
            let output = name;
            if (output.includes("Brian O'Conner")) {
                output = output.replace("Brian O'Conner", "<i class='italic text-gta-yellow'>Brian O'Conner</i>");
            }
            if (output.includes("(")) {
                output = output.replace(/\(([^)]+)\)/g, "<i class='text-[10px] opacity-40 font-sans tracking-normal'>($1)</i>");
            }
            return output;
        }

        var appState = { sort: 'garage', filter: 'all', search: '' };

        function $(id) { return document.getElementById(id); }
        function formatMoney(num) { return new Intl.NumberFormat('en-US', { style: 'currency', currency: 'USD', maximumFractionDigits: 0 }).format(num); }

        window.handleSearch = function(val) { appState.search = val.toLowerCase(); renderGrid(); };
        window.appClickSort = function(type) { appState.sort = type; appState.filter = 'all'; updateUI(); };
        window.appClickFilter = function(id) { appState.filter = id; updateUI(); };
        window.goToGarage = function(id) { appState.sort = 'garage'; appState.filter = id; updateUI(); $('filter-anchor').scrollIntoView({ behavior: 'smooth' }); };
        window.goToType = function(id) { appState.sort = 'type'; appState.filter = id; updateUI(); $('filter-anchor').scrollIntoView({ behavior: 'smooth' }); };

        function updateUI() {
            const btns = ['garage', 'type', 'brand', 'website'];
            btns.forEach(t => $( 'btn-' + t).className = 'btn-main ' + (appState.sort === t ? 'active' : ''));
            const titles = { garage: 'GARAGES', type: 'CLASSES', brand: 'MAKES', website: 'VENDORS' };
            $('gallery-title').innerText = titles[appState.sort];
            renderSubFilters();
            renderGrid();
        }

        function renderSubFilters() {
            const container = $('sub-filter-container');
            container.innerHTML = '';
            let items = [];
            if (appState.sort === 'garage') items = gtaData.garages.filter(g => !g.parent);
            else if (appState.sort === 'type') items = gtaData.types;
            else if (appState.sort === 'brand') {
                const unique = [...new Set(gtaData.vehicles.map(v => v.make))].sort();
                items = unique.map(m => ({ id: m, name: m }));
            }
            
            const createBtn = (id, label, isActive) => {
                const btn = document.createElement('button');
                btn.className = `btn-filter ${isActive ? 'active' : ''}`;
                btn.innerText = label.toUpperCase();
                btn.onclick = () => appClickFilter(id);
                return btn;
            };
            container.appendChild(createBtn('all', 'ALL', appState.filter === 'all'));
            items.forEach(item => {
                const sep = document.createElement('div');
                sep.className = 'w-px h-4 bg-zinc-800 mx-1';
                container.appendChild(sep);
                container.appendChild(createBtn(item.id, item.shortName || item.name, appState.filter === item.id));
            });
        }

        function renderGrid() {
            const grid = $('vehicle-grid');
            grid.innerHTML = '';
            let filtered = gtaData.vehicles;

            if (appState.filter !== 'all') {
                const fid = appState.filter;
                if (appState.sort === 'garage') filtered = filtered.filter(v => v.garageId === fid || gtaData.garages.find(x => x.id === v.garageId)?.parent === fid);
                else if (appState.sort === 'type') filtered = filtered.filter(v => v.type === fid);
                else if (appState.sort === 'brand') filtered = filtered.filter(v => v.make === fid);
                else filtered = filtered.filter(v => v.websiteId === fid);
            }

            if (appState.search) filtered = filtered.filter(v => v.name.toLowerCase().includes(appState.search) || v.make.toLowerCase().includes(appState.search));

            filtered.sort((a,b) => (b.val + getVehicleUpgradeCost(b.type)) - (a.val + getVehicleUpgradeCost(a.type)));
            $('display-count').innerText = filtered.length;
            const currentTotal = filtered.reduce((acc, v) => acc + v.val + getVehicleUpgradeCost(v.type), 0);
            $('display-value').innerText = formatMoney(currentTotal);

            filtered.forEach((v, i) => {
                const isRare = !!v.tier;
                const container = document.createElement('div');
                container.className = `v-card-container animate-in ${isRare ? 'can-flip tier-' + v.tier : ''}`;
                container.style.animationDelay = (i * 0.05) + 's';
                
                const upg = getVehicleUpgradeCost(v.type);
                const totalInvest = v.val + upg;
                const tierBadge = isRare ? `<div class="absolute top-2 left-2 z-20 bg-tier-${v.tier} text-black font-black text-[10px] px-2 py-0.5 rounded italic shadow-lg uppercase">${v.tier} TIER</div>` : '';
                
                // Variants to try for images
                const variants = getVehicleFilenameVariants(v.name);
                const primaryUrl = `images/vehicles/${variants[0]}`;

                let innerHtml = `
                    <div class="v-card-inner">
                        <div class="v-card-front v-card flex flex-col shadow-xl">
                            <div class="v-img-box">
                                ${tierBadge}
                                <img src="${primaryUrl}" 
                                     class="v-img" 
                                     loading="lazy" 
                                     onerror="handleImgError(this, '${v.name}')">
                                <div class="absolute top-2 right-2 bg-black/80 backdrop-blur px-2 py-1 rounded text-[10px] font-bold text-gta-yellow border border-zinc-700 uppercase">
                                    ${v.make}
                                </div>
                            </div>
                            <div class="p-4 flex flex-col flex-grow bg-zinc-900/40">
                                <div class="mb-4">
                                    <h3 class="text-white r-header text-lg leading-tight truncate uppercase">${formatVehicleDisplayName(v.name)}</h3>
                                    <div class="flex justify-between items-center mt-1">
                                        <div class="text-[10px] text-zinc-500 font-medium truncate italic">Loc: ${gtaData.garages.find(g => g.id === v.garageId)?.shortName || 'Unknown'}</div>
                                        <div class="text-[9px] text-gta-yellow font-black uppercase tracking-tighter">Full Mod</div>
                                    </div>
                                </div>
                                <div class="mt-auto pt-3 border-t border-zinc-800 flex justify-between items-end">
                                    <div class="text-[9px] text-zinc-500 font-bold uppercase tracking-widest">Total Investment</div>
                                    <div class="text-gta-green font-mono font-bold text-lg leading-none">${formatMoney(totalInvest)}</div>
                                </div>
                            </div>
                        </div>`;
                
                if (isRare) {
                    innerHtml += `
                        <div class="v-card-back shadow-2xl">
                            <div class="text-[10px] font-bold text-gta-yellow uppercase tracking-widest mb-2 flex items-center gap-2">
                                <i data-lucide="info" class="w-3 h-3"></i> RARITY INTEL
                            </div>
                            <p class="text-zinc-200 text-xs leading-relaxed italic">"${v.rarity}"</p>
                            <div class="mt-4 pt-4 border-t border-zinc-800 flex items-center justify-between">
                                <span class="text-[10px] font-black text-zinc-500 uppercase">${v.tier} Tier Asset</span>
                                <i data-lucide="shield-check" class="w-4 h-4 text-zinc-700"></i>
                            </div>
                        </div>`;
                }

                innerHtml += `</div>`;
                container.innerHTML = innerHtml;
                grid.appendChild(container);
            });
            if(window.lucide) lucide.createIcons();
        }

        // Image retry logic
        window.handleImgError = function(img, name) {
            const variants = getVehicleFilenameVariants(name);
            const retryCount = parseInt(img.dataset.retry || "0");
            
            if (retryCount < variants.length - 1) {
                img.dataset.retry = retryCount + 1;
                img.src = `images/vehicles/${variants[retryCount + 1]}`;
            } else {
                img.onerror = null;
                img.src = 'https://placehold.co/600x338/111/333?text=' + name.replace(/\s+/g, '+');
            }
        };

        function renderStats() {
            const c1 = $('stats-col-1'), c2 = $('stats-col-2'), pList = $('property-list-content');
            c1.innerHTML = ''; c2.innerHTML = ''; pList.innerHTML = '';
            
            const props = gtaData.garages.filter(g => !g.parent).sort((a,b) => ((b.val||0)+(b.upgradeVal||0)) - ((a.val||0)+(a.upgradeVal||0)));
            const pTotal = props.reduce((acc, p) => acc + (p.val || 0) + (p.upgradeVal || 0), 0);
            
            props.forEach((p, i) => {
                const row = document.createElement('div');
                const fullPVal = (p.val || 0) + (p.upgradeVal || 0);
                row.className = 'group flex justify-between items-center py-3 px-4 border-b border-zinc-800/50 hover:bg-zinc-800 transition-all cursor-pointer';
                row.onclick = () => goToGarage(p.id);
                row.innerHTML = `
                    <div class="flex items-center gap-3 overflow-hidden">
                        <span class="text-zinc-700 text-[10px] font-black group-hover:text-gta-yellow">${String(i+1).padStart(2, '0')}</span>
                        <div class="flex flex-col">
                            <span class="text-zinc-300 text-xs font-bold truncate group-hover:text-white uppercase">${p.shortName || p.name}</span>
                            <span class="text-[8px] text-gta-yellow font-black uppercase tracking-tighter">Renovated</span>
                        </div>
                    </div>
                    <span class="text-zinc-100 font-mono text-xs font-bold">${formatMoney(fullPVal)}</span>
                `;
                pList.appendChild(row);
            });
            
            $('props-total-val').innerText = formatMoney(pTotal);
            
            const vTotal = gtaData.vehicles.reduce((acc, v) => acc + v.val + getVehicleUpgradeCost(v.type), 0);
            const catMap = {};
            gtaData.types.forEach(t => catMap[t.id] = { ...t, val: 0, count: 0 });
            gtaData.vehicles.forEach(v => { 
                if(catMap[v.type]) { 
                    catMap[v.type].val += v.val + getVehicleUpgradeCost(v.type); 
                    catMap[v.type].count++; 
                } 
            });
            
            const activeCats = Object.values(catMap).filter(c => c.count > 0).sort((a,b) => b.val - a.val);
            const maxVal = Math.max(...activeCats.map(c => c.val));
            const half = Math.ceil(activeCats.length / 2);
            
            activeCats.forEach((cat, i) => {
                const pct = (cat.val / maxVal) * 100;
                const html = `
                    <div class="group cursor-pointer p-2 rounded hover:bg-white/5 transition" onclick="window.goToType('${cat.id}')">
                        <div class="flex justify-between items-baseline mb-1">
                            <span class="text-[10px] font-black text-zinc-400 uppercase tracking-widest group-hover:text-white">${cat.name}</span>
                            <span class="text-xs font-mono font-bold text-gta-green">${formatMoney(cat.val)}</span>
                        </div>
                        <div class="stat-bar-track"><div class="stat-bar-fill" style="width: ${pct}%; background-color: ${cat.color}"></div></div>
                    </div>
                `;
                (i < half ? c1 : c2).innerHTML += html;
            });
            
            $('veh-total-val').innerText = formatMoney(vTotal);
            const grand = pTotal + vTotal;
            $('grand-total').innerText = formatMoney(grand);
            $('header-cash').innerText = formatMoney(grand);
        }

        window.onload = function() {
            setTimeout(() => { 
                $('app-loader').style.opacity = '0';
                setTimeout(() => $('app-loader').style.display = 'none', 500);
            }, 800);
            if(window.lucide) lucide.createIcons();
            renderStats();
            updateUI();
        };
    </script>
</body>
</html>
