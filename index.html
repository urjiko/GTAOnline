        .v-card-container { perspective: 1000px; height: 100%; min-height: 350px; }
        .v-card-inner {

        .v-card-front, .v-card-back {
            position: absolute; width: 100%; height: 100%; -webkit-backface-visibility: hidden; backface-visibility: hidden;

        }
        .v-card-back {
            background-color: #0d0d0d; transform: rotateY(180deg);

        // --- HELPER: FILE NAME NORMALIZER ---
        // Alfasayısal olmayan her şeyi siler, Türkçe İ, I, ı karakterlerini 'i'ye normalize eder.
        function getCleanFilename(name) {
            if(!name) return "placeholder";
            return name.replace(/İ/g, 'i')
                       .replace(/I/g, 'i')
                       .replace(/ı/g, 'i')
                       .replace(/[^a-zA-Z0-9]/g, '')
                       .toLowerCase();
        }

        // --- FORMATTING: HIDDEN SYMBOLS & STYLE ---
        function formatDisplayString(text) {
            if (!text) return "";
            return text.replace(/\[([^\]]+)\]/g, '<span class="italic text-gta-yellow">$1</span>')
                       .replace(/\(([^)]+)\)/g, '<i class="italic">$1</i>');
        }

        function getNicknameOnly(text) {
            if (!text) return "";
            const matchBracket = text.match(/\[([^\]]+)\]/);
            if (matchBracket) return matchBracket[1].toUpperCase();
            const matchParen = text.match(/\(([^)]+)\)/);
            if (matchParen) return matchParen[1].toUpperCase();
            return text.toUpperCase();

        var appState = { sort: 'garage', filter: 'all', search: '' };

        function $(id) { return document.getElementById(id); }
        function formatMoney(num) { return new Intl.NumberFormat('en-US', { style: 'currency', currency: 'USD', maximumFractionDigits: 0 }).format(num); }

        window.handleSearch = function(val) { appState.search = val.toLowerCase(); renderGrid(); };
        window.appClickSort = function(type) { appState.sort = type; appState.filter = 'all'; updateUI(); };
        window.appClickFilter = function(id) { appState.filter = id; updateUI(); };

        function updateUI() {
            const btns = ['garage', 'type', 'brand'];
            btns.forEach(t => { if($( 'btn-' + t)) $( 'btn-' + t).className = 'btn-main ' + (appState.sort === t ? 'active' : ''); });
            
            const titles = { garage: 'GARAGES', type: 'CLASSES', brand: 'MANUFACTURERS' };
            let titleText = titles[appState.sort];

            if (appState.filter !== 'all') {
                if (appState.sort === 'garage') {
                    const g = gtaData.garages.find(x => x.id === appState.filter);
                    if (g) titleText = getNicknameOnly(g.name);
                } else {
                    titleText = appState.filter.toUpperCase();
                }
            }

            $('gallery-title').innerHTML = formatDisplayString(titleText);
            renderSubFilters();
            renderGrid();
        }

        function renderSubFilters() {
            const container = $('sub-filter-container');
            if(!container) return;
            container.innerHTML = '';
            let items = [];
            if (appState.sort === 'garage') items = (gtaData.garages || []);
            else if (appState.sort === 'type') items = (gtaData.types || []);
            else if (appState.sort === 'brand') {
                const unique = [...new Set((gtaData.vehicles || []).map(v => v.make))].sort();
                items = unique.map(m => ({ id: m, name: m }));
            }

            const createBtn = (id, label, isActive) => {
                const btn = document.createElement('button');
                btn.className = `btn-filter ${isActive ? 'active' : ''}`;
                btn.innerHTML = formatDisplayString(label).toUpperCase();
                btn.onclick = () => appClickFilter(id);
                return btn;
            };

            container.appendChild(createBtn('all', 'SHOW ALL', appState.filter === 'all'));
            items.forEach(item => {
                const sep = document.createElement('div');
                sep.className = 'w-px h-4 bg-zinc-800 mx-1';
                container.appendChild(sep);
                container.appendChild(createBtn(item.id, item.shortName || item.name, appState.filter === item.id));
            });
        }

        function renderGrid() {
            const grid = $('vehicle-grid');
            if(!grid) return;
            grid.innerHTML = '';
            
            let filtered = (gtaData.vehicles || []);

            if (appState.filter !== 'all') {
                const fid = appState.filter;
                if (appState.sort === 'garage') filtered = filtered.filter(v => v.garageId === fid);
                else if (appState.sort === 'type') filtered = filtered.filter(v => v.type === fid);
                else if (appState.sort === 'brand') filtered = filtered.filter(v => v.make === fid);
            }

            if (appState.search) filtered = filtered.filter(v => v.name.toLowerCase().includes(appState.search) || v.make.toLowerCase().includes(appState.search));

            filtered.forEach((v, i) => {
                const container = document.createElement('div');
                container.className = `animate-in`;
                container.style.animationDelay = (i * 0.005) + 's';
                
                const upg = 450000; 
                const baseFilename = v.name.replace(/[İIı]/g, 'i').replace(/[^a-zA-Z0-9]/g, "").toLowerCase();

                container.innerHTML = `
                    <div class="v-card flex flex-col shadow-xl">
                        <div class="v-img-box">
                            <img src="images/vehicles/${baseFilename}.jpg" class="v-img" loading="lazy" onerror="this.onerror=null; this.src='https://placehold.co/600x338/111/333?text='+encodeURIComponent('${v.name.split(' ')[0]}')">
                            <div class="absolute top-2 right-2 bg-black/80 backdrop-blur px-2 py-1 rounded text-[10px] font-bold text-gta-yellow border border-zinc-700 uppercase">
                                ${v.make}
                            </div>
                        </div>
                        <div class="p-4 flex flex-col flex-grow bg-zinc-900/40">
                            <div class="mb-4">
                                <h3 class="text-white font-display text-[15px] leading-[1.1] tracking-tighter uppercase mb-1">
                                    ${formatDisplayString(v.name)}
                                </h3>
                                <div class="flex justify-between items-center mt-1">
                                    <div class="text-[10px] text-zinc-500 font-medium truncate italic">Stored: ${gtaData.garages.find(g => g.id === v.garageId)?.name.split('[')[1]?.replace(']', '') || 'Collection'}</div>
                                    <div class="text-[9px] text-gta-yellow font-black uppercase tracking-tighter">MAX MOD</div>
                                </div>
                            </div>
                            <div class="mt-auto pt-3 border-t border-zinc-800 flex justify-between items-end">
                                <div class="text-[9px] text-zinc-500 font-bold uppercase tracking-widest leading-none">Investment</div>
                                <div class="text-gta-green font-mono font-bold text-[16px] leading-none">${formatMoney((v.val || 0) + upg)}</div>
                            </div>
                        </div>
                    </div>
                `;
                grid.appendChild(container);
            });

            $('display-count').innerText = filtered.length;
            const currentTotal = filtered.reduce((acc, v) => acc + (v.val || 0) + 450000, 0);
            $('display-value').innerText = formatMoney(currentTotal);
            if(window.lucide) lucide.createIcons();
        }

        function renderStats() {
            const c1 = $('stats-col-1'), c2 = $('stats-col-2'), pList = $('property-list-content');
            if(!c1 || !c2 || !pList) return;
            c1.innerHTML = ''; c2.innerHTML = ''; pList.innerHTML = '';
            
            const props = (gtaData.garages || []).sort((a,b) => ((b.val||0)+(b.upgradeVal||0)) - ((a.val||0)+(a.upgradeVal||0)));
            const pTotal = props.reduce((acc, p) => acc + (p.val || 0) + (p.upgradeVal || 0), 0);
            
            props.forEach((p, i) => {
                const row = document.createElement('div');
                const fullPVal = (p.val || 0) + (p.upgradeVal || 0);
                row.className = 'group flex justify-between items-center py-4 px-5 border-b border-zinc-800/60 hover:bg-zinc-800 transition-all cursor-pointer';
                row.onclick = () => { appState.filter = p.id; updateUI(); };
                row.innerHTML = `
                    <div class="flex items-center gap-3 overflow-hidden">
                        <span class="text-zinc-700 text-[10px] font-black group-hover:text-gta-yellow transition-colors">${String(i+1).padStart(2, '0')}</span>
                        <div class="flex flex-col">
                            <span class="text-zinc-200 text-xs font-bold truncate group-hover:text-white uppercase tracking-tight">${formatDisplayString(p.name)}</span>
                            <span class="text-[8px] text-gta-yellow font-black uppercase tracking-tighter opacity-80 italic">Elite Upgrade</span>
                        </div>
                    </div>
                    <span class="text-zinc-100 font-mono text-xs font-bold">${formatMoney(fullPVal)}</span>
                `;
                pList.appendChild(row);
            });
            
            $('props-total-val').innerText = formatMoney(pTotal);
            const vTotal = (gtaData.vehicles || []).reduce((acc, v) => acc + (v.val || 0) + 450000, 0);
            $('veh-total-val').innerText = formatMoney(vTotal);
            $('grand-total').innerText = formatMoney(pTotal + vTotal);
            $('header-cash').innerText = formatMoney(pTotal + vTotal);

            // Class Stats
            const catMap = {};
            gtaData.types.forEach(t => catMap[t.id] = { ...t, val: 0, count: 0 });
            gtaData.vehicles.forEach(v => { if(catMap[v.type]) { catMap[v.type].val += v.val + 450000; catMap[v.type].count++; } });
            const activeCats = Object.values(catMap).filter(c => c.count > 0).sort((a,b) => b.val - a.val);
            const maxVal = Math.max(...activeCats.map(c => c.val), 1);
            activeCats.forEach((cat, i) => {
                const pct = (cat.val / maxVal) * 100;
                const html = `<div class="group cursor-pointer p-2 rounded hover:bg-white/5 transition" onclick="window.appClickFilter('${cat.id}')"><div class="flex justify-between items-baseline mb-1"><div class="flex items-center gap-2"><div class="w-1.5 h-1.5 rounded-full" style="background-color: ${cat.color}"></div><span class="text-[10px] font-black text-zinc-400 uppercase tracking-widest group-hover:text-white">${cat.name}</span></div><span class="text-xs font-mono font-bold text-gta-green">${formatMoney(cat.val)}</span></div><div class="stat-bar-track"><div class="stat-bar-fill" style="width: ${pct}%; background-color: ${cat.color}"></div></div></div>`;
                (i < Math.ceil(activeCats.length / 2) ? c1 : c2).innerHTML += html;
            });
        }

        window.onload = function() {
            setTimeout(() => { 
                $('app-loader').style.opacity = '0';
                setTimeout(() => $('app-loader').style.display = 'none', 500);
            }, 800);
            if(window.lucide) lucide.createIcons();
            renderStats();
            updateUI();
        };
    </script>
