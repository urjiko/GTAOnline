            background-position: center;
            background-attachment: fixed;
            font-family: 'Inter', sans-serif;
        }
        .gta-panel { background-color: rgba(18, 18, 18, 0.95); border-top: 2px solid #333; border-bottom: 2px solid #333; }
        .asset-progress-bar { background-color: #333; height: 6px; width: 100%; margin-top: 6px; overflow: hidden; border-radius: 2px; }
        .asset-progress-fill { height: 100%; background-color: #fbbf24; transition: width 1s ease-out; }
        .btn-sort { font-family: 'Oswald', sans-serif; text-transform: uppercase; background: transparent; color: #888; border: 1px solid #333; padding: 8px 20px; font-size: 1rem; cursor: pointer; transition: all 0.2s; }
        .btn-sort:hover { color: #fff; border-color: #666; }
        .btn-sort.active { background-color: #fbbf24; color: #000; border-color: #fbbf24; font-weight: bold; }
        .filter-container { overflow-x: auto; white-space: nowrap; padding: 0.5rem 0; }
        .btn-filter { font-family: 'Oswald', sans-serif; color: #9ca3af; font-weight: 500; text-transform: uppercase; padding: 0.25rem 0; margin: 0; border-bottom: 3px solid transparent; transition: all 0.2s ease; display: inline-block; font-size: 1.1rem; cursor: pointer; }
        .btn-filter:hover { color: #fff; }
        .btn-filter.active { color: #fbbf24; border-bottom-color: #fbbf24; }
        .filter-separator { color: #52525b; font-weight: 200; padding: 0 0.75rem; display: inline-block; vertical-align: middle; font-size: 1.2rem; }
        .vehicle-card { background-color: #121212; border: 1px solid #333; transition: transform 0.2s, border-color 0.2s; position: relative; overflow: hidden; }
        .vehicle-card:hover { border-color: #fbbf24; transform: translateY(-3px); box-shadow: 0 10px 20px rgba(0,0,0,0.5); }
        .vehicle-image { width: 100%; aspect-ratio: 16/9; object-fit: cover; border-bottom: 4px solid #000; }
        .update-tag { position: absolute; top: 0; left: 0; background: rgba(0,0,0,0.9); color: #fbbf24; font-family: 'Oswald', sans-serif; font-size: 0.75rem; padding: 4px 8px; text-transform: uppercase; letter-spacing: 0.5px; }
        details summary::-webkit-details-marker { display: none; }
        details summary { list-style: none; outline: none; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        .fade-in { animation: fadeIn 0.4s ease-out forwards; }
        /* Hide scrollbar for filter container */
        .filter-container::-webkit-scrollbar { display: none; }
        .filter-container { -ms-overflow-style: none; scrollbar-width: none; }
    </style>

        function renderStats() {
            const listCol1 = document.getElementById('asset-summary-list-1');
            const listCol2 = document.getElementById('asset-summary-list-2');
            const propList = document.getElementById('property-details-content');
            
            listCol1.innerHTML = '';
            listCol2.innerHTML = '';
            propList.innerHTML = '';
            
            // Categories
            const cats = [
                { id: 'super', label: 'Super Cars' }, { id: 'sports', label: 'Sports Cars' },
                { id: 'classic', label: 'Classic Cars' }, { id: 'muscle', label: 'Muscle Cars' },
                { id: 'weaponized', label: 'Weaponized' }, { id: 'arena', label: 'Arena War' },
                { id: 'special', label: 'Special Vehicles' }, { id: 'offroad', label: 'Off-Road' },
                { id: 'motorcycle', label: 'Motorcycles' }, { id: 'aircraft', label: 'Air Vehicles' },
                { id: 'helicopter', label: 'Helicopters' }, { id: 'sea_vehicle', label: 'Sea Vehicles' },
                { id: 'open_wheel', label: 'Open Wheel' }, { id: 'other', label: 'Other' }
            ];

            let grandTotal = 0;
            let propTotal = 0;

            // Calculate Property Totals
            const properties = mockData.garages.filter(g => g.basePrice > 0 && !g.parentId);
            properties.forEach(g => propTotal += (g.basePrice + g.upgradePrice));

            properties.sort((a,b) => (b.basePrice+b.upgradePrice) - (a.basePrice+a.upgradePrice))
                .forEach((p, i) => {
                    propList.innerHTML += `
                    <div class="flex justify-between border-b border-gray-800 pb-2">
                        <span class="text-zinc-500 font-bold mr-2">${i+1}.</span>
                        <span class="text-zinc-300 truncate flex-1">${p.name}</span>
                        <span class="text-white font-mono">${formatCurrency(p.basePrice + p.upgradePrice)}</span>
                    </div>`;
            });
            
            document.getElementById('total-properties-count').innerText = `${properties.length} Properties`;
            document.getElementById('total-properties-value').innerText = formatCurrency(propTotal);

            // Calculate Vehicle Stats
            const catStats = {};
            mockData.vehicles.forEach(v => {
                const cost = v.basePrice + v.upgradePrice;
                grandTotal += cost;
                
                let typeKey = v.type;
                if (['sedan', 'suv', 'coupe', 'utility', 'service', 'rc'].includes(v.type)) typeKey = 'other';
                
                if (!catStats[typeKey]) catStats[typeKey] = { val: 0, count: 0 };
                catStats[typeKey].val += cost;
                catStats[typeKey].count += 1;
            });

            const maxVal = Math.max(...Object.values(catStats).map(s => s.val), 0);

            // Sort and render categories
            cats.sort((a, b) => (catStats[b.id]?.val || 0) - (catStats[a.id]?.val || 0));
            
            const half = Math.ceil(cats.length / 2);
            cats.forEach((cat, index) => {
                const stat = catStats[cat.id] || { val: 0, count: 0 };
                if (stat.count > 0) {
                    const width = maxVal > 0 ? (stat.val / maxVal) * 100 : 0;
                    const html = `
                        <div class="flex flex-col space-y-1 mb-3">
                            <div class="flex justify-between items-center">
                                <span class="text-xs font-bold text-zinc-400 uppercase tracking-wide">${cat.label}</span>
                                <span class="text-xs font-bold text-white">${stat.count} Vehicles</span>
                            </div>
                            <div class="asset-progress-bar">
                                <div class="asset-progress-fill" style="width: ${width}%;"></div>
                            </div>
                            <div class="text-right text-xs font-bold text-gta-green font-mono tracking-tight">
                                ${formatCurrency(stat.val)}
                            </div>
                        </div>`;
                    if (index < half) listCol1.innerHTML += html;
                    else listCol2.innerHTML += html;
                }
            });

            document.getElementById('grand-total-display').innerText = formatCurrency(grandTotal + propTotal);
            document.getElementById('total-vehicles-count').innerText = `${mockData.vehicles.length} Owned`;
            document.getElementById('total-vehicles-value').innerText = formatCurrency(grandTotal);
        }

        function renderGrid() {
            const grid = document.getElementById('vehicle-grid');
            const empty = document.getElementById('empty-state');
            const filteredCount = document.getElementById('filtered-count');
            const filteredValue = document.getElementById('filtered-value');
            const propertyCostDisplay = document.getElementById('property-cost-display');
            const propertyCostValue = document.getElementById('property-cost-value');
            
            grid.innerHTML = '';
            let propertyCost = 0;

            // Background & Property Value Logic
            propertyCostDisplay.classList.add('hidden');
            if (currentSort === 'garage' && currentFilter !== 'all') {
                document.body.style.backgroundImage = `linear-gradient(to bottom, rgba(0,0,0,0.8), #000), url('images/background/${currentFilter}.jpg')`;
                
                const garage = mockData.garages.find(g => g.id === currentFilter);
                if (garage && (garage.basePrice > 0 || garage.upgradePrice > 0)) {
                    propertyCost = (garage.basePrice || 0) + (garage.upgradePrice || 0);
                    propertyCostValue.innerText = formatCurrency(propertyCost);
                    propertyCostDisplay.classList.remove('hidden');
                }
            } else {
                document.body.style.backgroundImage = `linear-gradient(to bottom, rgba(0,0,0,0.85), #000), url('https://placehold.co/1920x1080/111/222?text=LS+Background')`;
            }

            // Filtering
            let filtered = [];
            if (currentFilter === 'all') {
                filtered = mockData.vehicles;
            } else {
                if (currentSort === 'garage') {
                    filtered = mockData.vehicles.filter(v => 
                        v.garageId === currentFilter || 
                        mockData.garages.find(g => g.id === v.garageId)?.parentId === currentFilter
                    );
                } else if (currentSort === 'type') {
                    filtered = mockData.vehicles.filter(v => v.type === currentFilter);
                } else if (currentSort === 'website') {
                    filtered = mockData.vehicles.filter(v => v.websiteId === currentFilter);
                }
            }

            // Sort by Price
            filtered.sort((a, b) => (b.basePrice + b.upgradePrice) - (a.basePrice + a.upgradePrice));

            // Update UI
            filteredCount.innerText = filtered.length;
            const totalVal = filtered.reduce((acc, v) => acc + v.basePrice + v.upgradePrice, 0) + propertyCost;
            filteredValue.innerText = formatCurrency(totalVal);

            if (filtered.length === 0) {
                empty.classList.remove('hidden');
            } else {
                empty.classList.add('hidden');
                filtered.forEach((v, i) => {
                    const total = v.basePrice + v.upgradePrice;
                    const card = document.createElement('div');
                    card.className = 'vehicle-card fade-in';
                    card.style.animationDelay = `${i * 0.03}s`;
                    
                    const typeObj = mockData.types.find(t => t.id === v.type);
                    const typeName = typeObj ? typeObj.name : v.type;
                    const webObj = mockData.websites.find(w => w.id === v.websiteId);
                    const websiteName = webObj ? webObj.name : 'Unknown';

                    card.innerHTML = `
                        <div class="relative">
                             <img src="${v.image}" class="vehicle-image" onerror="this.src='https://placehold.co/600x400/111/333?text=${encodeURIComponent(v.name)}'">
                             <span class="update-tag">★ ${v.update}</span>
                        </div>
                        <div class="p-3 bg-zinc-900">
                            <div class="flex justify-between items-start mb-2">
                                <div>
                                    <h3 class="text-white font-bold text-lg leading-tight uppercase font-display truncate w-48" title="${v.name}">${v.name}</h3>
                                    <span class="text-gray-500 text-xs uppercase font-bold tracking-wider block">${typeName}</span>
                                </div>
                            </div>
                            <div class="flex justify-between items-end border-t border-gray-800 pt-2 mt-2">
                                <div class="text-gta-yellow text-xs uppercase font-bold truncate w-24" title="${websiteName}">${websiteName}</div>
                                <div class="text-gta-green font-mono font-bold text-lg tracking-tight">${formatCurrency(total)}</div>
                            </div>
                        </div>
                    `;
                    grid.appendChild(card);
                });
            }
        }

        function renderSubFilters() {
            const container = document.getElementById('sub-filter-container');
            container.innerHTML = '';
            
            // ALL Button
            const allBtn = document.createElement('button');
            allBtn.className = `btn-filter ${currentFilter === 'all' ? 'active' : ''}`;
            allBtn.innerText = 'All';
            allBtn.onclick = () => { currentFilter = 'all'; updateUI(); };
            container.appendChild(allBtn);
            
            // Separator
            const sep = document.createElement('span');
            sep.className = 'filter-separator';
            sep.innerText = '|';
            container.appendChild(sep);

            // Items
            let items = [];
            if (currentSort === 'garage') items = mockData.garages.filter(g => !g.parentId);
            else if (currentSort === 'type') items = mockData.types;
            else items = mockData.websites;

            items.forEach((item, idx) => {
                const btn = document.createElement('button');
                btn.className = `btn-filter ${currentFilter === item.id ? 'active' : ''}`;
                btn.innerText = item.name;
                btn.onclick = () => { currentFilter = item.id; updateUI(); };
                container.appendChild(btn);

                if (idx < items.length - 1) {
                    const s = document.createElement('span');
                    s.className = 'filter-separator';
                    s.innerText = '|';
                    container.appendChild(s);
                }
            });
        }

        function updateUI() {
            // Update Sort Tabs
            document.getElementById('sort-garage').className = `btn-sort ${currentSort === 'garage' ? 'active' : ''}`;
            document.getElementById('sort-type').className = `btn-sort ${currentSort === 'type' ? 'active' : ''}`;
            document.getElementById('sort-website').className = `btn-sort ${currentSort === 'website' ? 'active' : ''}`;

            // Update Title
            const title = document.getElementById('dynamic-gallery-title');
            if (currentSort === 'garage') title.innerText = 'GARAGES';
            else if (currentSort === 'type') title.innerText = 'VEHICLE TYPES';
            else title.innerText = 'DEALERSHIPS';

            // Toggle Prop List
            const propList = document.getElementById('property-list-container');
            if (currentSort === 'garage') propList.classList.remove('hidden');
            else propList.classList.add('hidden');

            renderSubFilters();
            renderGrid();
        }

        function changeSort(type) {
            currentSort = type;
            currentFilter = 'all';
            updateUI();
        }

        // Init
        document.addEventListener('DOMContentLoaded', () => {
            if (window.lucide) lucide.createIcons();
            renderStats();
            updateUI();
        });

    </script>
</body>
</html>
